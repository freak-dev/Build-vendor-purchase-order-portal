spring:
  application:
    name: vendor-purchase-order-portal
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vendor_portal?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:portal_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
