services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vendor_portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: ${DB_PASSWORD:-portal_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    environment:
      DB_URL: jdbc:mysql://db:3306/vendor_portal?serverTimezone=UTC
      DB_USER: portal
      DB_PASSWORD: ${DB_PASSWORD:-portal_dev_only}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    restart: unless-stopped
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    ports: ["${HTTP_PORT:-8088}:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  mysql-data:
