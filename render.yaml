services:
  - type: web
    name: vendor-portal-api-shreyansh-23102b0017
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: vendor-portal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vendor-portal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: vendor-portal-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: vendor-portal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vendor-portal-db
          property: password
      - key: FLYWAY_LOCATIONS
        value: classpath:db/migration-postgresql
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_CORS_ORIGINS
        value: https://vendor-portal-web-shreyansh-23102b0017.onrender.com
