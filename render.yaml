databases:
  - name: vendor-portal-db
    plan: free
    region: singapore
    databaseName: vendor_portal
    user: portal

services:
  - type: web
    name: vendor-portal-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: vendor-portal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vendor-portal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: vendor-portal-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: vendor-portal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vendor-portal-db
          property: password
      - key: FLYWAY_LOCATIONS
        value: classpath:db/migration-postgresql
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_CORS_ORIGINS
        value: https://vendor-portal-web.onrender.com

  - type: web
    name: vendor-portal-web
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vendor-portal-api.onrender.com
