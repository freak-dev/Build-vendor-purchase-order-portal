jenkins:
  systemMessage: "Local Vendor Purchase Order Portal CI"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "portal-admin-password"
              secret: "${ADMIN_PASSWORD}"
          - string:
              scope: GLOBAL
              id: "portal-db-password"
              secret: "${DB_PASSWORD}"
          - string:
              scope: GLOBAL
              id: "portal-mysql-root-password"
              secret: "${MYSQL_ROOT_PASSWORD}"
